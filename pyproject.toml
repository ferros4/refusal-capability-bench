[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refusal-capability-bench"
version = "0.1.0"
description = "Refusal + capability eval harness for local OpenAI-compatible LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "datasets>=2.19.0",
  "pyyaml>=6.0",
  "tqdm>=4.66.0",
  "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[project.scripts]
refusal-capability-bench = "run_eval:main_cli"

[tool.setuptools]
py-modules = ["run_eval"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: end-to-end tests against a mock OpenAI-compatible server",
]

[tool.uv]
package = true
