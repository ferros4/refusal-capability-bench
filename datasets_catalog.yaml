# Capability / coding (chat completion only — no tool calling; scored locally)
capability_bench_details:
  - id: gsm8k
    hf: openai/gsm8k@main
    kind: math
  - id: mmlu
    hf: cais/mmlu
    kind: knowledge
  - id: humaneval
    hf: openai/openai_humaneval
    kind: coding
    note: function completion; unit tests in subprocess; no tools
  - id: mbpp
    hf: google-research-datasets/mbpp@sanitized
    kind: coding
    note: NL→Python; assert-list tests; no tools
  - id: humanevalplus
    hf: evalplus/humanevalplus
    kind: coding
    note: HumanEval+ stronger tests; chat-only; no tools

# Gated URLs (request access while logged into HF):
gated_urls:
  - https://huggingface.co/datasets/walledai/XSTest
  - https://huggingface.co/datasets/walledai/AdvBench
  - https://huggingface.co/datasets/walledai/HarmBench
