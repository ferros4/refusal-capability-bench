 # Dataset + suite catalog
# Recommended: python run_eval.py --list-presets
#              python run_eval.py --list-datasets
# Loaders: harness/refusal_datasets.py , harness/presets.py

# Suite presets (refusal + capability). Prefer --preset <name>.
# Source of truth: harness/presets.py (this file is documentation only).
# An empty list means that suite is intentionally skipped.
# Unified runner layout: results/<model>/<timestamp>/refusal|capability/
suite_presets:
  default:
    refusal: [cyber-overrefusal, generic-compliance]
    capability: [gsm8k, mmlu, humaneval]
  quick:
    refusal: [cyber-overrefusal, generic-compliance, xstest, donotanswer, advbench]
    capability: [gsm8k, mmlu, humaneval]
  compare:
    note: same as quick; intended for --compare base vs uncensored
    refusal: [cyber-overrefusal, generic-compliance, xstest, donotanswer, advbench]
    capability: [gsm8k, mmlu, humaneval]
  overrefusal:
    refusal: [cyber-overrefusal, generic-compliance, xstest, orbench, wildchat-over-refusal, coconot]
    capability: [gsm8k, mmlu, humaneval]
  should-refuse:
    refusal: [donotanswer, advbench, harmbench, strongreject, sorrybench, harmfulqa, llm-lat-harmful]
    capability: [gsm8k, mmlu, humaneval]
  cyber:
    refusal: [cyber-overrefusal, cyber-code-vuln, generic-compliance]
    capability: [gsm8k, mmlu, humaneval]
  # refusal-only: runs default refusal pack; capability is empty on purpose
  refusal-only:
    refusal: [cyber-overrefusal, generic-compliance]
    capability: []
  # capability-only: runs core benches; refusal is empty on purpose
  capability-only:
    refusal: []
    capability: [gsm8k, mmlu, humaneval]
  capability-smoke:
    refusal: []
    capability: [gsm8k, mmlu, humaneval]
    note: same datasets as capability-only; use a small --limit
  # coding: chat-only code completion + local unit tests (no tool calling)
  coding:
    refusal: []
    capability: [humaneval, mbpp, humanevalplus]
  coding-smoke:
    refusal: []
    capability: [humaneval, mbpp, humanevalplus]
    note: same as coding; use a small --limit
  mentioned:
    note: broad recommendation list — see harness/presets.py / refusal_datasets PRESETS["mentioned"]
    capability: [gsm8k, mmlu, humaneval]
  full:
    note: all registered refusal datasets + all capability benches
    capability: [gsm8k, mmlu, humaneval, mbpp, humanevalplus]
  all:
    note: alias of full

# Core pack used by most presets (gsm8k/mmlu/humaneval). Coding extras below.
capability_datasets: [gsm8k, mmlu, humaneval, mbpp, humanevalplus]
capability_core: [gsm8k, mmlu, humaneval]
coding_datasets: [humaneval, mbpp, humanevalplus]

datasets:
